<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Perfil</title>
  <!-- Ajustar ruta del CSS -->
  <link rel="stylesheet" href="src/styles/usuario.css" />
</head>
<body>
  <header class="header">
    <div class="header-content">
      <h1 id="header-title">Mi Perfil</h1>
    </div>
  </header>
  <div class="container">
    <h1 data-i18n="mi-perfil-title">Mi Perfil</h1>
    <div id="user-data">
      <!-- User data will be displayed here -->
    </div>
  </div>
  <!-- Barra de navegación inferior -->
  <footer class="footer">
    <nav class="nav-bar">
      <!-- Ajuste de las rutas de navegación -->
      <a href="main.html">
        <img src="src/assets/img/casa.png" alt="Inicio" />
        <span>Inicio</span>
      </a>
      <a href="ajustes.html" class="active">
        <img src="src/assets/img/ajustes.png" alt="Ajustes" />
        <span>Ajustes</span>
      </a>
      <a href="usuario.html">
        <img src="src/assets/img/perfil.png" alt="Mi Perfil" />
        <span>Mi Perfil</span>
      </a>
    </nav>
  </footer>


  <!-- Ajuste para usar módulos de ES -->
  <script type="module">
    import './src/js/data/idioma.js';
    import './src/js/data/configuraciones.js';

    document.addEventListener('DOMContentLoaded', function() {
      let userData = JSON.parse(localStorage.getItem('userData'));

      if (!userData) {
        userData = {
          nombre: 'Nombre: por defecto',
          apellido: 'Apellido: por defecto',
          sexo: 'No especificado',
          viajeroFrecuente: 'No'
        };
      }

      const userDataDiv = document.getElementById('user-data');
      userDataDiv.innerHTML = `
        <div class="user-data-item"><strong>Nombre:</strong> ${userData.nombre}</div>
        <div class="user-data-item"><strong>Apellido:</strong> ${userData.apellido}</div>
        <div class="user-data-item"><strong>Sexo:</strong> ${userData.sexo}</div>
        <div class="user-data-item"><strong>¿Viajero frecuente?:</strong> ${userData.viajeroFrecuente}</div>
      `;
    });
  </script>
</body>
</html>
